name: maceasytier
options:
  bundleIdPrefix: com.example
  developmentLanguage: zh-Hans
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  maceasytier:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    postBuildScripts:
      - name: Embed EasyTier binaries
        script: '"$SRCROOT/Scripts/embed-core.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.maceasytier
        PRODUCT_NAME: MacEasyTier
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/maceasytier.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_OBJC_BRIDGING_HEADER: App/Core/MacEasyTier-Bridging-Header.h
        OTHER_LDFLAGS: "$(inherited) -framework Security"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.example.maceasytier.dev
          PRODUCT_NAME: MacEasyTierDev
          PRODUCT_MODULE_NAME: MacEasyTier
  MacEasyTierTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: maceasytier
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.maceasytier.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MacEasyTierDev.app/Contents/MacOS/MacEasyTierDev"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  maceasytier:
    build:
      targets:
        maceasytier: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MacEasyTierTests
